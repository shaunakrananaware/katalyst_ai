[project]
name = "katalyst-sales-memory"
version = "0.1.0"
description = "A FastAPI and React sales-memory prototype"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "google-genai==2.22.0",
    "networkx==3.4.2",
    "rapidfuzz==3.14.5",
    "fastembed==0.8.0",
    "numpy==2.2.6",
    "python-dotenv==1.2.3",
]

[tool.vercel]
entrypoint = "backend.main:app"

[tool.vercel.scripts]
build = "npm ci --prefix frontend && npm run build --prefix frontend"
